<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1110">
<title>Paciente Cero</title>
<style>
  :root { --verde: #9be37a; --naranja: #ff8a1f; --texto: #e8efe9; --suave: #b9c8bc; --panel: rgba(10, 14, 12, .82); --borde: rgba(155, 227, 122, .35); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1110; color: var(--texto); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#vista { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .capa { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(6, 9, 8, .78); z-index: 20; overflow-y: auto; }
  .capa.ver { display: flex; }
  .tarjeta { width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--borde); border-radius: 16px; padding: 22px 20px; text-align: center; }
  h1 { margin: 0; font-size: clamp(38px, 9vw, 64px); letter-spacing: 2px; color: var(--verde); text-shadow: 0 0 22px rgba(120, 220, 90, .35); }
  h2 { margin: 0 0 10px; font-size: 24px; color: var(--verde); }
  .sub { margin: 6px 0 16px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #8fa892; }
  .ciudad { margin: 0 0 6px; font-size: 17px; line-height: 1.45; }
  .ciudad b { color: var(--verde); }
  .btn { display: block; width: 100%; min-height: 52px; margin: 10px 0 0; border-radius: 12px; font: 600 18px system-ui, sans-serif; cursor: pointer; border: 2px solid var(--borde); background: transparent; color: var(--texto); }
  .btn.principal { background: var(--naranja); border-color: var(--naranja); color: #1a0d00; }
  .btn[hidden] { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .chip { min-height: 48px; padding: 0 14px; border-radius: 24px; border: 1px solid var(--borde); background: transparent; color: var(--texto); font: 15px system-ui, sans-serif; cursor: pointer; }
  .chip.activo { background: rgba(155, 227, 122, .18); border-color: var(--verde); color: var(--verde); }
  .ayuda { margin-top: 16px; font-size: 14px; line-height: 1.5; color: var(--suave); text-align: left; }
  .etiqueta { margin-top: 18px; font-size: 14px; color: var(--suave); }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  #hud.ver { display: block; }
  #info { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; display: flex; gap: 8px; align-items: flex-start; }
  #lugar { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.35; }
  #lugar b { color: var(--verde); font-size: 16px; }
  #ambiente-txt { margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(155, 227, 122, .25); color: #ffe2b0; }
  #toast { position: absolute; left: 50%; top: max(84px, calc(env(safe-area-inset-top) + 72px)); transform: translate(-50%, -10px); opacity: 0; transition: opacity .4s, transform .4s; background: var(--panel); border: 1px solid #ffb347; color: #ffe2b0; border-radius: 12px; padding: 10px 16px; font-size: 16px; text-align: center; max-width: min(90vw, 460px); }
  #toast.ver { opacity: 1; transform: translate(-50%, 0); }
  @media (orientation: portrait) and (max-width: 600px) { #toast { top: max(140px, calc(env(safe-area-inset-top) + 128px)); } }
  .efectos { margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: var(--suave); text-align: left; }
  .efectos b { color: #ffe2b0; }
  #btn-pausa { pointer-events: auto; width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--borde); background: var(--panel); color: var(--texto); font: 700 18px system-ui; cursor: pointer; }
  #mini { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(155, 227, 122, .55); background: rgba(8, 12, 10, .75); pointer-events: auto; cursor: pointer; }
  #aviso { position: absolute; left: 50%; bottom: 38%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 10px 16px; font-size: 16px; text-align: center; display: none; max-width: 90vw; }
  #aviso small { display: block; font-size: 14px; color: var(--suave); margin-top: 2px; }
  #mira { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255, 255, 255, .7); }
  #palanca { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .06); display: none; }
  #palanca i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
  #pista-tactil { position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); text-align: center; font-size: 14px; color: rgba(255, 255, 255, .8); text-shadow: 0 1px 3px #000; display: none; padding: 0 16px; }
  #mapa-grande canvas { max-width: 720px; max-height: 720px; min-width: 240px; min-height: 240px; border-radius: 14px; border: 1px solid var(--borde); background: #0a0e0c; }
  #mapa-grande { flex-direction: column; gap: 10px; }
  #mapa-info { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 16px; padding: 4px 12px; background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; width: min(92vw, 720px); }
  #mapa-info small { display: block; font-size: 14px; color: var(--suave); }
  #leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 14px; color: var(--suave); width: min(92vw, 720px); }
  #leyenda span::before { content: ''; display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; border-radius: 3px; background: var(--c); border: 2px solid var(--b); }
  #mapa-grande canvas { width: min(92vw, calc(100vh - 220px)); height: min(92vw, calc(100vh - 220px)); }
  #mapa-grande .cerrar { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; width: auto; padding: 0 18px; background: var(--panel); }
  @media (orientation: portrait) and (max-width: 600px) { #mini { width: 112px; height: 112px; } }
  /* ---------- jugabilidad ---------- */
  #hud-juego { position: fixed; inset: 0; pointer-events: none; z-index: 11; display: none; }
  #hud-juego.ver { display: block; }
  #velo, #verdoso, #ojo { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  #velo { box-shadow: inset 0 0 160px 60px rgba(200, 0, 0, .9); }
  #verdoso { box-shadow: inset 0 0 200px 90px rgba(60, 200, 40, .8); }
  #ojo { background: radial-gradient(circle, transparent 40%, rgba(255, 180, 60, .5)); }
  #pistas { position: absolute; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 6px 12px; font-size: 14px; color: #ffe2b0; max-width: 46vw; text-align: center; }
  #jefe { position: absolute; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 70px); transform: translateX(-50%); width: min(420px, 44vw); display: none; text-align: center; font-size: 16px; font-weight: 700; color: #ff9c8c; text-shadow: 0 1px 3px #000; }
  #jefe b { display: block; height: 12px; margin-top: 4px; background: rgba(0, 0, 0, .6); border: 1px solid #ff9c8c; border-radius: 6px; overflow: hidden; }
  #jefe i { display: block; height: 100%; background: #d83a2a; }
  #flotante { position: absolute; left: 50%; top: 40%; transform: translate(-50%, 0); font-size: 20px; font-weight: 700; color: #ffe2b0; text-shadow: 0 2px 4px #000; opacity: 0; white-space: nowrap; }
  #flotante.ver { animation: flota 1.3s ease-out; }
  @keyframes flota { 0% { opacity: 0; transform: translate(-50%, 10px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }
  #reloj-mini { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-size: 32px; font-weight: 800; color: #fff; text-shadow: 0 2px 6px #000; display: none; }
  #reloj-mini.ver { display: block; }
  #barras { position: absolute; left: 12px; bottom: max(14px, env(safe-area-inset-bottom)); width: min(260px, 40vw); display: flex; flex-direction: column; gap: 6px; }
  .barra { position: relative; height: 22px; background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .25); border-radius: 6px; overflow: hidden; }
  .barra i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transition: width .2s; }
  #b-vida i { background: #d84a3a; } #b-est i { background: #e0b030; }
  .barra span { position: relative; padding-left: 8px; font-size: 14px; line-height: 22px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px #000; }
  #dinero { font-size: 18px; font-weight: 800; color: #ffd84a; text-shadow: 0 1px 3px #000; }
  #efecto-vac { font-size: 14px; color: #b9e8ff; text-shadow: 0 1px 2px #000; }
  #vacunas { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
  #vacunas button { width: 64px; min-height: 52px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .3); background: var(--panel); color: var(--texto); font: 600 14px system-ui; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 2px; }
  #vacunas button i { width: 10px; height: 18px; border-radius: 4px; background: var(--c, #333); }
  #vacunas button:disabled { opacity: .45; }
  #municion { position: absolute; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); text-align: right; font-size: 16px; color: #fff; text-shadow: 0 1px 3px #000; }
  #municion b { font-size: 34px; }
  #municion small { font-size: 14px; color: #e0d6c0; }
  #botones { display: none; }
  .touch #botones { display: block; }
  .touch #municion { bottom: auto; top: calc(max(12px, env(safe-area-inset-top)) + 160px); }
  @media (max-height: 500px) { #mini { width: 110px !important; height: 110px !important; } .touch #municion { top: calc(max(12px, env(safe-area-inset-top)) + 120px); } }
  #botones button { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .45); background: rgba(10, 14, 12, .55); color: #fff; font: 700 14px system-ui; width: 64px; height: 64px; }
  #btn-disparar { right: 20px; bottom: 84px; width: 96px !important; height: 96px !important; background: rgba(255, 138, 31, .85) !important; border-color: #ff8a1f !important; color: #1a0d00 !important; font-size: 16px !important; }
  #btn-recargar { right: 128px; bottom: 60px; }
  #btn-usar { right: 128px; bottom: 134px; display: none; background: rgba(155, 227, 122, .3) !important; border-color: #9be37a !important; }
  #btn-usar.ver { display: block; }
  #btn-cambiar { right: 46px; bottom: 192px; }
  #btn-hab { right: 202px; bottom: 60px; font-size: 14px !important; line-height: 1.1; background: conic-gradient(rgba(255, 200, 80, .6) var(--p, 0%), rgba(10, 14, 12, .55) 0) !important; }
  #btn-hab.lista { border-color: #ffd84a !important; box-shadow: 0 0 16px #ffd84a; }
  @media (orientation: portrait) and (max-width: 600px) {
    #barras { width: 44vw; } #pistas { top: auto; bottom: 200px; max-width: 70vw; }
    #vacunas { left: 12px; transform: none; bottom: 150px; flex-direction: column; } #vacunas button { width: 56px; }
  }
  .tarjeta.ancha { width: min(680px, 100%); }
  #personajes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 8px 0; }
  .pj { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; border-radius: 12px; border: 2px solid var(--borde); background: rgba(255, 255, 255, .03); color: var(--texto); font: 15px system-ui; cursor: pointer; min-height: 48px; }
  .pj img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; background: #222; }
  .pj small { font-size: 14px; color: var(--suave); }
  .pj .vent { color: #ffe2b0; }
  .pj.activo { border-color: var(--naranja); background: rgba(255, 138, 31, .14); }
  .btn:disabled { opacity: .45; }
  #panel-cuerpo { text-align: left; max-height: 58vh; overflow-y: auto; }
  .fila { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, .1); }
  .fila b { display: block; font-size: 16px; }
  .fila small { display: block; font-size: 14px; color: var(--suave); line-height: 1.35; }
  .btn-comprar { flex: none; min-width: 88px; min-height: 48px; border-radius: 10px; border: 2px solid var(--verde); background: rgba(155, 227, 122, .12); color: var(--verde); font: 700 16px system-ui; cursor: pointer; }
  .btn-comprar:disabled { opacity: .4; }
  .nota { font-size: 15px; line-height: 1.5; color: var(--suave); }
  .rodillos { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
  .rodillos span { min-width: 92px; padding: 14px 6px; border-radius: 10px; background: #1a1220; border: 2px solid #e09cff; text-align: center; font-weight: 700; font-size: 15px; }
  .tablero { display: grid; grid-template-columns: repeat(3, 72px); gap: 6px; justify-content: center; margin: 10px 0; }
  .tablero button { width: 72px; height: 72px; border-radius: 10px; border: 2px solid var(--borde); background: rgba(255, 255, 255, .05); color: #fff; font: 800 32px system-ui; cursor: pointer; }

</style>
</head>
<body>
<canvas id="vista"></canvas>

<div id="hud">
  <div id="info"><button id="btn-pausa" aria-label="Pausa">II</button><div id="lugar"><b id="lugar-nombre"></b><br><span id="lugar-semilla"></span><div id="ambiente-txt"></div></div></div>
  <div id="toast"></div>
  <canvas id="mini" width="300" height="300" aria-label="Minimapa: tócalo para ver el mapa grande"></canvas>
  <div id="mira"></div>
  <div id="aviso"></div>
  <div id="palanca"><i></i></div>
  <div id="pista-tactil">Dedo izquierdo: caminar (hasta el borde para correr) · Dedo derecho: mirar</div>

<div id="hud-juego">
  <div id="velo"></div><div id="verdoso"></div><div id="ojo"></div>
  <div id="pistas"></div>

  <div id="flotante"></div>
  <div id="reloj-mini"></div>
  <div id="barras">
    <div class="barra" id="b-vida"><i></i><span></span></div>
    <div class="barra" id="b-est"><i></i><span></span></div>
    <div class="barra" id="b-inf"><i></i><span></span></div>
    <div id="dinero"></div>
    <div id="efecto-vac"></div>
  </div>
  <div id="vacunas"></div>
  <div id="municion"></div>
  <div id="botones">
    <button id="btn-hab" aria-label="Ojo muerto">Ojo<br>muerto</button>
    <button id="btn-cambiar" aria-label="Cambiar de arma">Arma</button>
    <button id="btn-recargar" aria-label="Recargar">Recargar</button>
    <button id="btn-usar" aria-label="Usar">Usar</button>
    <button id="btn-disparar" aria-label="Disparar">Disparar</button>
  </div>
</div>

<div class="capa" id="elegir">
  <div class="tarjeta ancha">
    <h2>Elige tu personaje</h2>
    <div id="personajes"></div>
    <button class="btn principal" id="btn-empezar" disabled>Empezar</button>
    <button class="btn" id="btn-volver-pj">Volver</button>
  </div>
</div>

<div class="capa" id="panel">
  <div class="tarjeta ancha">
    <h2 id="panel-titulo"></h2>
    <div class="sub" id="panel-dinero"></div>
    <div id="panel-cuerpo"></div>
    <button class="btn" id="panel-cerrar">Salir</button>
  </div>
</div>

<div class="capa" id="fin">
  <div class="tarjeta">
    <h2 id="fin-titulo"></h2>
    <p class="ciudad" id="fin-txt"></p>
    <button class="btn principal" id="btn-fin">Volver al inicio</button>
  </div>
</div>

<div class="capa ver" id="inicio">
  <div class="tarjeta">
    <h1>PACIENTE CERO</h1>
    <div class="sub">Seis Balas C · la ciudad</div>
    <p class="ciudad" id="guardada-txt" hidden></p>
    <button class="btn principal" id="btn-continuar" hidden>Continuar</button>
    <p class="ciudad" id="ciudad-txt" style="margin-top:14px"></p>
    <button class="btn" id="btn-nueva">Nueva partida</button>
    <button class="btn" id="btn-otra">Otra ciudad</button>
    <div class="etiqueta">Ver otro tipo de mapa:</div>
    <div class="chips" id="chips"></div>
    <div class="ayuda" id="ayuda"></div>
  </div>
</div>

<div class="capa" id="pausa">
  <div class="tarjeta">
    <h2>Pausa</h2>
    <p class="ciudad" id="pausa-txt"></p>
    <button class="btn principal" id="btn-seguir">Seguir</button>
    <button class="btn" id="btn-inicio">Guardar y volver al inicio</button>
  </div>
</div>

<div class="capa" id="mapa-grande">
  <canvas id="mapa-cv" width="900" height="900" aria-label="Mapa de la ciudad"></canvas>
  <button class="btn cerrar" id="btn-cerrar-mapa">Cerrar mapa</button>
  <div id="mapa-info">Toca un edificio para ver su nombre</div>
  <div id="leyenda"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="datos.js"></script>
<script src="kit.js"></script>
<script src="decorado.js"></script>
<script>
'use strict';
const D = window.DATOS, $ = s => document.querySelector(s);
const TACTIL = 'ontouchstart' in window || matchMedia('(pointer: coarse)').matches;
if (TACTIL) document.documentElement.classList.add('touch');
const PASO = D.lote + D.calle;
const EDIF = Object.fromEntries(D.edificios.map(e => [e.id, e]));
const MAPA = Object.fromEntries(D.mapas.map(m => [m.id, m]));
const CLAVE = 'pc_partida';

// ---------- azar con semilla: la misma semilla arma siempre la misma ciudad ----------
function azar(semilla) {
  let a = semilla >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const elegir = (R, lista) => lista[Math.floor(R() * lista.length)];
function barajar(R, lista) { const l = lista.slice(); for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; } return l; }
const semillaNueva = () => 10000 + Math.floor(Math.random() * 90000);
const mapaDelNivel = (semilla, nivel) => elegir(azar(semilla * 7 + nivel), D.mapasPorNivel[nivel]);

// ---------- generar la ciudad ----------
function generarCiudad(semilla, mapaId, nivel) {
  const R = azar(semilla), M = MAPA[mapaId], ocupado = new Array(M.w * M.h).fill(-1), lotes = [];
  const cabe = (x, y, w, h) => {
    if (x < 0 || y < 0 || x + w > M.w || y + h > M.h) return false;
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (ocupado[j * M.w + i] >= 0) return false;
    return true;
  };
  for (const tam of ['D', 'C', 'B', 'A']) for (let k = 0; k < M.lotes[tam]; k++) {
    const [tw, th] = D.tamanos[tam], formas = tw === th ? [[tw, th]] : [[tw, th], [th, tw]], posibles = [];
    for (const [w, h] of formas) for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) if (cabe(x, y, w, h)) posibles.push({ x, y, w, h });
    if (!posibles.length) continue;
    const p = elegir(R, posibles), id = lotes.length;
    for (let j = p.y; j < p.y + p.h; j++) for (let i = p.x; i < p.x + p.w; i++) ocupado[j * M.w + i] = id;
    lotes.push({ tam, ...p });
  }
  // qué edificio va en cada lote
  const usados = new Set(), libres = tam => lotes.filter(l => !l.ed && l.tam === tam);
  const poner = (id, l) => { l.ed = EDIF[id]; usados.add(id); };
  const tiendas = [];
  for (const id of D.reglas.siempre) {
    const c = libres(EDIF[id].lote); if (!c.length) continue;
    // las tiendas quedan separadas entre sí: se elige el lote más lejos de las demás
    let mejor = null, md = -1;
    for (const l of barajar(R, c)) { const d = tiendas.length ? Math.min(...tiendas.map(t => Math.hypot(t.x - l.x, t.y - l.y))) : 99; if (d > md) { md = d; mejor = l; } }
    poner(id, mejor); tiendas.push(mejor);
  }
  for (const l of libres('D')) { const op = barajar(R, D.edificios.filter(e => e.cat === 'jefe' && !usados.has(e.id))); if (op.length) poner(op[0].id, l); }
  let mj = D.reglas.minijefesPorNivel[nivel] || 1;
  for (const e of barajar(R, D.edificios.filter(e => e.cat === 'minijefe'))) { if (!mj) break; const c = libres(e.lote); if (c.length) { poner(e.id, elegir(R, c)); mj--; } }

  pintarAmbiente(dt);
  if ((cuentaMini & 15) === 0 || estado !== 'jugar') $('#ambiente-txt').textContent = textoAmbiente();
  render.render(escena, camara);
  if (estado === 'jugar' && ++cuentaMini % 3 === 0) dibujarMini();
}
function ajustar() { render.setSize(innerWidth, innerHeight, false); camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix(); }
addEventListener('resize', ajustar); ajustar();

// una dirección como ?semilla=12345&mapa=centro abre esa ciudad en el inicio
const q = new URLSearchParams(location.search);
nuevaPrevia(+q.get('semilla') || semillaNueva(), MAPA[q.get('mapa')] ? q.get('mapa') : null);
mostrarInicio();
requestAnimationFrame(cuadro);
window.__pc = { get ciudad() { return ciudad; }, get estado() { return estado; }, J, amb, efectos, CLIMA, pasarTiempo, avisar, generarCiudad, continuar, nuevaPartida, guardar, leerGuardada, abrirMapa };
